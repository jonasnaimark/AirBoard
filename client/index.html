<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AirBoard Panel</title>
    <link rel="stylesheet" href="css/styles.css?v=20260108">
</head>
<body>
    <div class="container">
        <!-- Device Templates Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Device Templates 
                        <button onclick="addDebugPanel()" style="
                            background: #444; 
                            border: 1px solid #666; 
                            color: #ccc; 
                            padding: 2px 6px; 
                            border-radius: 3px; 
                            font-size: 9px;
                            margin-left: 10px;
                            cursor: pointer;
                        ">🐛 Debug</button>
                    </h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="device-templates">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="device-templates">
                <div class="control-row device-row">
                    <div class="unified-dropdown-container">
                        <select id="deviceType" class="dropdown">
                            <option value="iphone">iPhone - 393</option>
                            <option value="iphone-402">iPhone - 402</option>
                            <option value="desktop">Web - 1440</option>
                            <option disabled>──────────</option>
                            <option value="iphone15">iPhone 15 - 393</option>
                            <option value="iphone16">iPhone 16 - 402</option>
                            <option disabled>──────────</option>
                            <option value="iphone-simple">iPhone Simple - 393</option>
                            <option value="iphone-simple-402">iPhone Simple - 402</option>
                            <option disabled>──────────</option>
                            <option value="web-chrome">Web Chrome - 1440</option>
                        </select>
                        <select id="resolutionMultiplier" class="dropdown resolution-dropdown">
                            <option value="1">1x</option>
                            <option value="2" selected>2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                            <option value="6">6x</option>
                        </select>
                    </div>
                    <button id="addDevice" class="main-button">Make Comp</button>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Keyframe Reader Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Keyframe Nudger</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="keyframe-reader">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="keyframe-reader">
                <!-- Top row with 5 equal-width elements -->
                <div class="control-row keyframe-top-row">
                    <!-- 1. Read Keyframes (icon button, same handler) -->
                    <button id="readKeyframes" class="stagger-btn" title="Read Keyframes">
                        <svg width="18" height="18" viewBox="0 0 62 62" fill="none">
                            <path d="M48 13C50.2091 13 52 14.7909 52 17V53C52 55.2091 50.2091 57 48 57H21C18.7909 57 17 55.2091 17 53H48V13Z" fill="white"/>
                            <rect x="11" y="7" width="31" height="40" stroke="white" stroke-width="4" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <!-- 2. Snap keys to playhead -->
                    <button class="stagger-btn" id="snapToPlayheadBtn" type="button" title="Snap to playhead&#10;Shift: Remove delays">
                        <svg width="18" height="18" viewBox="0 0 62 62" fill="none">
                            <path d="M31 30L31 58" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <path d="M50.3682 51L41.8829 42.5147L50.3682 34.0294" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M11.6025 50.9727L20.0878 42.4874L11.6025 34.0021" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M40 3C41.1046 3 42 3.89543 42 5V18.1377C42 18.6735 41.7851 19.1876 41.4033 19.5635L32.4033 28.4248C31.6248 29.1913 30.3752 29.1913 29.5967 28.4248L20.5967 19.5635C20.2149 19.1876 20 18.6735 20 18.1377V5C20 4.46957 20.2109 3.96101 20.5859 3.58594C20.961 3.21086 21.4696 3 22 3L40 3Z" stroke="white" stroke-width="4" stroke-linejoin="round"/>
                            <path d="M46 42.5H60" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 42.5L17 42.5" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <!-- 3. Mirror keys -->
                    <button class="stagger-btn" id="mirrorKeysBtn" type="button" title="Mirror keys">
                        <svg width="22" height="18" viewBox="0 0 76 62" fill="none">
                            <path d="M38 7L38 55" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <rect x="61.6853" y="20.1716" width="16" height="16" transform="rotate(45 61.6853 20.1716)" stroke="white" stroke-width="4"/>
                            <rect x="14.2854" y="20.1716" width="16" height="16" transform="rotate(45 14.2854 20.1716)" stroke="white" stroke-width="4"/>
                        </svg>
                    </button>
                    <!-- 4. Trim in point -->
                    <button class="stagger-btn" id="trimInBtn" type="button" title="Trim in-point&#10;Shift: Min in-point">
                        <svg width="21" height="18" viewBox="0 0 72 62" fill="none">
                            <path d="M60.0049 13L12.0049 13" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <rect x="15.9998" y="29.1774" width="16" height="16" transform="rotate(45 15.9998 29.1774)" stroke="white" stroke-width="4"/>
                        </svg>
                    </button>
                    <!-- 5. Trim out-point -->
                    <button class="stagger-btn" id="trimOutBtn" type="button" title="Trim out-point&#10;Shift: Max out-point">
                        <svg width="21" height="18" viewBox="0 0 72 62" fill="none">
                            <path d="M60.0049 13L12.0049 13" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <rect x="56" y="29.1774" width="16" height="16" transform="rotate(45 56 29.1774)" stroke="white" stroke-width="4"/>
                        </svg>
                    </button>
                    <!-- 6. Stagger direction -->
                    <button class="stagger-btn" id="staggerActionBtn" type="button" title="Stagger direction">
                        <svg width="18" height="18" viewBox="0 0 62 62" fill="none">
                            <path d="M43 31L19 31" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <path d="M29 48L5 48" stroke="white" stroke-width="4" stroke-linecap="round"/>
                            <path d="M57 14L33 14" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <!-- 7. More actions dropdown -->
                    <div class="dropdown-container">
                        <button class="stagger-btn" id="moreActionsBtn" type="button" title="More actions">
                            <svg width="18" height="18" viewBox="0 0 62 62" fill="none">
                                <path d="M16 24L31 39L46 24" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <div class="custom-select-menu" id="moreActionsDropdown">
                            <div class="custom-select-option" data-action="copy-keys">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M55 13C57.2091 13 59 14.7909 59 17V53C59 55.2091 57.2091 57 55 57H28C25.7909 57 24 55.2091 24 53H55V13Z" fill="currentColor"/>
                                    <rect x="12" y="7" width="37" height="40" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                                    <path d="M38.5293 25.9297L30.044 17.4444L21.5587 25.9297" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M30.0566 35.5312L30.0566 20.5313" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Copy springs</span>
                            </div>
                            <div class="custom-select-option" data-action="paste-keys">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M55 13C57.2091 13 59 14.7909 59 17V53C59 55.2091 57.2091 57 55 57H28C25.7909 57 24 55.2091 24 53H55V13Z" fill="currentColor"/>
                                    <rect x="12" y="7" width="37" height="40" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                                    <path d="M22 27.0469L30.4853 35.5322L38.9706 27.0469" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M30.4727 17.4453L30.4727 32.4453" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Paste springs</span>
                            </div>
                            <div class="custom-select-option" data-action="3-point-curve">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M24.078 23.0782L18.9998 18L6.27183 30.7279L18.9998 43.4558L24.078 38.3776" stroke="currentColor" stroke-width="4"/>
                                    <path d="M41.0782 23.0782L36 18L23.2721 30.7279L36 43.4558L41.0782 38.3776" stroke="currentColor" stroke-width="4"/>
                                    <rect x="53" y="18.1716" width="18" height="18" transform="rotate(45 53 18.1716)" fill="black" stroke="currentColor" stroke-width="4"/>
                                </svg>
                                <span>Make 3 point curve</span>
                            </div>
                            <div class="custom-select-option" data-action="extend-comp">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="7" y="11" width="57" height="40" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                                    <rect x="18" y="11" width="35" height="40" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                                    <path d="M36 38L36 24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M29 31H43" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Extend comp</span>
                            </div>
                            <div class="custom-select-option" data-action="crop-comp">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20 4V47H45.8M63 47H52.25" stroke="currentColor" stroke-width="4"/>
                                    <path d="M52 58L52 15L26.2 15M9 15L19.75 15" stroke="currentColor" stroke-width="4"/>
                                </svg>
                                <span>Crop comp</span>
                            </div>
                            <div class="custom-select-option" data-action="child-rig">
                                <svg width="18" height="18" viewBox="0 0 72 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M26 38H12C9.79086 38 8 36.2091 8 34V17C8 14.7909 9.79086 13 12 13H39C41.2091 13 43 14.7909 43 17V34C43 36.2091 41.2091 38 39 38H34" stroke="currentColor" stroke-width="4"/>
                                    <path d="M47 23H61C63.2091 23 65 24.7909 65 27V44C65 46.2091 63.2091 48 61 48H34C31.7909 48 30 46.2091 30 44V27C30 24.7909 31.7909 23 34 23H39" stroke="currentColor" stroke-width="4"/>
                                </svg>
                                <span>Child Rig</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row">
                    <div class="resolution-display" id="frameMultiplierDisplay">
                        <span id="frameMultiplierText">Frames</span>
                        <div class="frame-slider-container">
                            <div class="frame-slider-track"></div>
                            <div class="frame-slider-marker" data-value="1"></div>
                            <div class="frame-slider-marker" data-value="3"></div>
                            <div class="frame-slider-marker" data-value="9"></div>
                            <div class="frame-slider-marker" data-value="30"></div>
                            <div class="frame-slider-marker" data-value="60"></div>
                            <div class="frame-slider-marker" data-value="120"></div>
                            <div class="frame-slider-handle" id="frameSliderHandle"></div>
                        </div>
                        <div class="stagger-controls">
                            <div class="scrub-input-wrapper">
                                <div class="scrub-zone scrub-zone-left"></div>
                                <input class="stagger-input" id="globalFrameInput" type="number" value="3" min="1" step="1" data-tooltip="Frames">
                                <div class="scrub-zone scrub-zone-right"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row">
                    <div class="resolution-display" id="delayDisplay">
                        <span id="delayText" style="opacity: 0.75;">Delay</span>
                        <div class="stagger-controls">
                            <button class="stagger-btn decrement" id="delayDecrementBtn" type="button" title="Shift: Ignore precomps">−</button>
                            <button class="stagger-btn increment" id="delayIncrementBtn" type="button" title="Shift: Ignore precomps">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row">
                    <div class="resolution-display" id="durationDisplay">
                        <span id="durationText" style="opacity: 0.75;">Duration</span>
                        <div class="stagger-controls">
                            <button class="stagger-btn decrement" id="durationDecrementBtn" type="button">−</button>
                            <button class="stagger-btn increment" id="durationIncrementBtn" type="button">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row" id="staggerRow">
                    <div class="resolution-display" id="staggerDisplay">
                        <span id="staggerText">Stagger</span>
                        <div class="stagger-controls">
                            <button class="stagger-btn decrement" id="staggerDecrementBtn" type="button">−</button>
                            <button class="stagger-btn increment" id="staggerIncrementBtn" type="button">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row position-row" id="xDistanceRow">
                    <div class="keyframe-display" id="xDistanceDisplay">
                        <span id="xDistanceText">X distance</span>
                        <div class="distance-controls">
                            <button class="distance-btn in-out-btn selected" id="xInBtn" type="button">In</button>
                            <button class="distance-btn in-out-btn" id="xOutBtn" type="button">Out</button>
                            <button class="distance-btn nudge-btn decrement" id="xDecrementBtn" type="button"><span class="triangle triangle-left"></span></button>
                            <button class="distance-btn nudge-btn increment" id="xIncrementBtn" type="button"><span class="triangle triangle-right"></span></button>
                        </div>
                    </div>
                </div>
                <div class="control-row compact-row position-row" id="yDistanceRow">
                    <div class="keyframe-display" id="yDistanceDisplay">
                        <span id="yDistanceText">Y distance</span>
                        <div class="distance-controls">
                            <button class="distance-btn in-out-btn selected" id="yInBtn" type="button">In</button>
                            <button class="distance-btn in-out-btn" id="yOutBtn" type="button">Out</button>
                            <button class="distance-btn nudge-btn decrement" id="yDecrementBtn" type="button"><span class="triangle triangle-up"></span></button>
                            <button class="distance-btn nudge-btn increment" id="yIncrementBtn" type="button"><span class="triangle triangle-down"></span></button>
                        </div>
                    </div>
                </div>
                </div>
            </section>
        </div>

        <!-- Gestures & Components Section -->
        <div class="section-container dual-section-container" data-section-name="Gestures & Components">
            <section class="section">
                <div class="dual-section-header">
                    <div class="dual-column-row">
                        <div class="dual-column dual-column-left">
                            <label class="dual-column-label">Gestures</label>
                        </div>
                        <div class="dual-column dual-column-right">
                            <label class="dual-column-label">Components</label>
                        </div>
                    </div>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="gestures-components">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="gestures-components">
                    <div class="dual-column-row dual-controls-row">
                        <div class="dual-column dual-column-left">
                            <div class="dual-column-controls">
                                <select id="gestureType" class="dropdown">
                                    <option value="tap">Tap</option>
                                    <option value="longpress">Long Press</option>
                                    <option value="doubletap">Double Tap</option>
                                    <option value="mouseclick">Mouse Click</option>
                                </select>
                                <button id="addGesture" class="dual-column-add-btn">+</button>
                            </div>
                        </div>
                        <div class="dual-column dual-column-right">
                            <div class="dual-column-controls">
                                <select id="componentType" class="dropdown">
                                    <option value="dot-loader">Dots</option>
                                    <option value="iphone-ui">iPhone UI</option>
                                    <option value="timer">Ms Counter</option>
                                    <option value="belo-spin">Belo Spin</option>
                                </select>
                                <button id="addComponent" class="dual-column-add-btn">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Presets Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Presets</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="effect-presets">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="effect-presets">
                <div class="subsection-title">
                    <svg width="14" height="14" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="8" width="46" height="46" rx="14" stroke="currentColor" stroke-width="4"/>
                    </svg>
                    Shape
                </div>
                <div class="control-row">
                    <select id="squircleMode" class="dropdown">
                        <option value="new">New Shape</option>
                        <option value="replace">Replace Shape</option>
                    </select>
                    <button id="addSquircle" class="main-button" title="Add Squircle (Shift+click for comp-sized, radius scales with resolution)">
                        Add Squircle
                    </button>
                </div>
                <div class="control-row">
                    <select id="nullType" class="dropdown">
                        <option value="layers">Layers</option>
                        <option value="layers-padding">Layers + Padding</option>
                        <option value="vertex-nulls">Add Vertex Nulls</option>
                    </select>
                    <button id="addNull" class="main-button">Fit to Squircle</button>
                </div>
                <hr class="subsection-divider">
                <div class="subsection-title">
                    <svg width="14" height="14" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14.75 40.75V47.25H21.25V50.5H14.75V57H11.5V50.5H5V47.25H11.5V40.75H14.75ZM29.4432 9.407C29.8755 7.96725 31.8093 7.86975 32.443 9.121L32.5568 9.407L37.175 24.8185L52.5897 29.4432C53.9255 29.8462 54.1043 31.5395 53.1228 32.287L52.8757 32.443L52.5897 32.5568L37.175 37.175L32.5535 52.5897C32.1505 53.9255 30.4573 54.1043 29.7098 53.1228L29.5537 52.8757L29.44 52.5897L24.8185 37.175L9.407 32.5568C8.07125 32.1538 7.8925 30.4605 8.874 29.713L9.121 29.557L9.407 29.4432L24.8185 24.8185L29.4432 9.407V9.407ZM50.5 5V11.5H57V14.75H50.5V21.25H47.25V14.75H40.75V11.5H47.25V5H50.5Z" fill="currentColor"/>
                    </svg>
                    Effects
                </div>
                <div class="control-row">
                    <select id="elevationType" class="dropdown">
                        <option value="1">Elevation 1</option>
                        <option value="2">Elevation 2</option>
                        <option value="3">Elevation 3</option>
                        <option value="4">Elevation 4</option>
                    </select>
                    <button id="addShadow" class="main-button">Add Shadow</button>
                </div>
                <div class="control-row">
                    <select id="materialType" class="dropdown">
                        <option value="Light Extra Thin">Light Extra Thin</option>
                        <option value="Light Thin">Light Thin</option>
                        <option value="Light Regular">Light Regular</option>
                        <option value="Light Thick">Light Thick</option>
                        <option value="Light Extra Thick">Light Extra Thick</option>
                        <option disabled>──────────</option>
                        <option value="Dark Extra Thin">Dark Extra Thin</option>
                        <option value="Dark Thin">Dark Thin</option>
                        <option value="Dark Regular">Dark Regular</option>
                        <option value="Dark Thick">Dark Thick</option>
                        <option value="Dark Extra Thick">Dark Extra Thick</option>
                        <option disabled>──────────</option>
                        <option value="Glass">Glass</option>
                    </select>
                    <button id="addBlur" class="main-button">Add Blur</button>
                </div>
                <hr class="subsection-divider">
                <div class="subsection-title">
                    <svg width="14" height="14" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="25" width="12" height="12" rx="6" fill="currentColor"/>
                        <rect x="25" y="25" width="12" height="12" rx="6" fill="currentColor"/>
                        <rect x="45" y="25" width="12" height="12" rx="6" fill="currentColor"/>
                    </svg>
                    Shimmer
                </div>
                <div class="control-row">
                    <select id="shimmerType" class="dropdown">
                        <option value="selected">Selected Layers</option>
                        <option value="overlay">Overlay Layer</option>
                    </select>
                    <button id="addShimmer" class="main-button">Add Shimmer</button>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Project Setup Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Project Setup</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="project-setup">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="project-setup">
                <div class="control-row">
                    <button id="aeFolders" class="main-button">AE Folders</button>
                    <button id="finderFolders" class="main-button">Finder Folders</button>
                </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Extend Comp Dialog -->
    <div id="extendCompOverlay" class="dialog-overlay">
        <div id="extendCompDialog" class="extend-comp-dialog">
            <div class="dialog-content">
                <label class="dialog-label" style="margin-bottom: 6px; line-height: 1.5;">Extends the comp and layers at the last frame, including nested precomps.</label>
                <div class="dialog-input-wrapper">
                    <input type="number" id="extendCompInput" class="dialog-input" min="1" placeholder="">
                    <span class="dialog-suffix">Frames</span>
                </div>
                <div class="dialog-buttons">
                    <button id="extendCompCancel" class="dialog-btn cancel-btn">Cancel</button>
                    <button id="extendCompApply" class="dialog-btn apply-btn">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Crop Comp Dialog -->
    <div id="cropCompOverlay" class="dialog-overlay">
        <div id="cropCompDialog" class="extend-comp-dialog">
            <div class="dialog-content">
                <label class="dialog-label" style="margin-bottom: 6px; line-height: 1.5;">Crops comp to fit content and adjusts all comp instances.</label>
                <div class="dialog-radio-group">
                    <label class="dialog-radio-option">
                        <input type="radio" name="cropMode" value="currentFrame" checked>
                        <span class="radio-custom"></span>
                        <span class="radio-label">Crop to current frame</span>
                    </label>
                    <label class="dialog-radio-option">
                        <input type="radio" name="cropMode" value="entireDuration">
                        <span class="radio-custom"></span>
                        <span class="radio-label">Crop to entire duration</span>
                    </label>
                </div>
                <div class="dialog-buttons">
                    <button id="cropCompCancel" class="dialog-btn cancel-btn">Cancel</button>
                    <button id="cropCompApply" class="dialog-btn apply-btn">Crop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Adobe's CEP JavaScript library -->
    <script src="js/CSInterface.js"></script>
    <!-- Load our custom JavaScript -->
    <script src="js/main.js?v=20260108"></script>
</body>
</html>
