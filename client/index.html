<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AirBoard Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Device Templates Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Device Templates 
                        <button onclick="addDebugPanel()" style="
                            background: #444; 
                            border: 1px solid #666; 
                            color: #ccc; 
                            padding: 2px 6px; 
                            border-radius: 3px; 
                            font-size: 9px;
                            margin-left: 10px;
                            cursor: pointer;
                        ">🐛 Debug</button>
                    </h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="device-templates">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="device-templates">
                <div class="control-row">
                    <select id="deviceType" class="dropdown">
                        <option value="iphone">iPhone UI - 393</option>
                        <option value="desktop">Web - 1440</option>
                        <option disabled>──────────</option>
                        <option value="iphone15">iPhone 15 - 393</option>
                        <option value="iphone-simple">iPhone Simple - 393</option>
                        <option value="web-chrome">Web Chrome - 1440</option>
                    </select>
                    <button id="addDevice" class="main-button">Make Comp</button>
                </div>
                <div class="control-row">
                    <div class="resolution-display" id="resolutionDisplay">
                        <span id="resolutionText">Resolution: 2x</span>
                        <div class="number-controls">
                            <button class="number-btn decrement" type="button">−</button>
                            <button class="number-btn increment" type="button">+</button>
                        </div>
                    </div>
                    <input type="hidden" id="resolutionMultiplier" value="2">
                </div>
                </div>
            </section>
        </div>
        
        <!-- Gesture Presets Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Gestures</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="gesture-presets">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="gesture-presets">
                <div class="control-row">
                    <select id="gestureType" class="dropdown">
                        <option value="tap">Tap</option>
                        <option value="longpress">Long Press</option>
                        <option value="doubletap">Double Tap</option>
                        <option value="mouseclick">Mouse Click</option>
                    </select>
                    <button id="addGesture" class="main-button">Add Gesture</button>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Keyframe Reader Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Keyframe Nudger</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="keyframe-reader">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="keyframe-reader">
                <!-- Top row with 5 equal-width elements -->
                <div class="control-row keyframe-top-row">
                    <!-- 1. Read Keyframes (icon button, same handler) -->
                    <button id="readKeyframes" class="stagger-btn" title="Read Keyframes">
                        <svg width="18" height="18" viewBox="0 0 1200 1200" fill="#ffffff">
                            <path d="m787.5 112.5h-525c-19.887 0.019531-38.949 7.9297-53.012 21.988-14.059 14.062-21.969 33.125-21.988 53.012v675c0.019531 19.887 7.9297 38.949 21.988 53.012 14.062 14.059 33.125 21.969 53.012 21.988h525c19.883-0.023438 38.949-7.9336 53.008-21.992 14.059-14.059 21.969-33.125 21.992-53.008v-675c-0.023438-19.883-7.9336-38.949-21.992-53.008-14.059-14.059-33.125-21.969-53.008-21.992zm-525 750v-675h525l0.039062 675z"/>
                            <path d="m1012.5 487.5c0-13.398-7.1484-25.777-18.75-32.477-11.602-6.6992-25.898-6.6992-37.5 0-11.602 6.6992-18.75 19.078-18.75 32.477v487.5c-0.011719 9.9414-3.9648 19.477-10.996 26.504-7.0273 7.0312-16.562 10.984-26.504 10.996h-487.5c-13.398 0-25.777 7.1484-32.477 18.75-6.6992 11.602-6.6992 25.898 0 37.5 6.6992 11.602 19.078 18.75 32.477 18.75h487.5c29.828-0.03125 58.422-11.895 79.512-32.988 21.094-21.09 32.957-49.684 32.988-79.512z"/>
                        </svg>
                    </button>
                    <!-- 2. Stagger direction (moved from stagger row) -->
                    <button class="stagger-btn" id="staggerActionBtn" type="button" title="Stagger direction">
                        <img src="assets/icons/Stagger Icon.png" alt="Stagger" style="width: 18px; height: 18px;">
                    </button>
                    <!-- 3. Snap keys to playhead (placeholder icon, no functionality yet) -->
                    <button class="stagger-btn" id="snapToPlayheadBtn" type="button" title="Snap keys to playhead">
                        <img src="assets/icons/Snap to Playhead Icon.png" alt="Snap" style="width: 18px; height: 18px;">
                    </button>
                    <!-- 4. Mirror keys (placeholder icon, no functionality yet) -->
                    <button class="stagger-btn" id="mirrorKeysBtn" type="button" title="Mirror keys">
                        <img src="assets/icons/Mirror Icon.png" alt="Mirror" style="width: 21px; height: 18px;">
                    </button>
                    <!-- 5. Global frame number input (replaces 3 inputs below) -->
                    <input class="stagger-input" id="globalFrameInput" type="number" value="3" min="0.1" max="99" step="0.1" data-tooltip="Frames">
                </div>
                <div class="control-row">
                    <div class="resolution-display" id="delayDisplay">
                        <span id="delayText" style="opacity: 0.75;">Delay</span>
                        <div class="stagger-controls">
                            <button class="stagger-btn decrement" id="delayDecrementBtn" type="button">−</button>
                            <button class="stagger-btn increment" id="delayIncrementBtn" type="button">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row">
                    <div class="resolution-display" id="durationDisplay">
                        <span id="durationText" style="opacity: 0.75;">Duration</span>
                        <div class="stagger-controls">
                            <button class="stagger-btn decrement" id="durationDecrementBtn" type="button">−</button>
                            <button class="stagger-btn increment" id="durationIncrementBtn" type="button">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row" id="staggerRow">
                    <div class="keyframe-display" id="staggerDisplay">
                        <span id="staggerText">Stagger</span>
                        <div class="distance-controls">
                            <button class="stagger-btn decrement" id="staggerDecrementBtn" type="button">−</button>
                            <button class="stagger-btn increment" id="staggerIncrementBtn" type="button">+</button>
                        </div>
                    </div>
                </div>
                <div class="control-row position-row" id="xDistanceRow">
                    <div class="keyframe-display" id="xDistanceDisplay">
                        <span id="xDistanceText">X distance</span>
                        <div class="distance-controls">
                            <button class="distance-btn in-out-btn selected" id="xInBtn" type="button">In</button>
                            <button class="distance-btn in-out-btn" id="xOutBtn" type="button">Out</button>
                            <button class="distance-btn nudge-btn decrement" id="xDecrementBtn" type="button"><span class="triangle triangle-left"></span></button>
                            <button class="distance-btn nudge-btn increment" id="xIncrementBtn" type="button"><span class="triangle triangle-right"></span></button>
                        </div>
                    </div>
                </div>
                <div class="control-row position-row" id="yDistanceRow">
                    <div class="keyframe-display" id="yDistanceDisplay">
                        <span id="yDistanceText">Y distance</span>
                        <div class="distance-controls">
                            <button class="distance-btn in-out-btn selected" id="yInBtn" type="button">In</button>
                            <button class="distance-btn in-out-btn" id="yOutBtn" type="button">Out</button>
                            <button class="distance-btn nudge-btn decrement" id="yDecrementBtn" type="button"><span class="triangle triangle-up"></span></button>
                            <button class="distance-btn nudge-btn increment" id="yIncrementBtn" type="button"><span class="triangle triangle-down"></span></button>
                        </div>
                    </div>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Presets Section -->      
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Presets</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="effect-presets">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="effect-presets">
                <div class="subsection-title">Shape</div>
                <div class="control-row">
                    <select id="squircleMode" class="dropdown">
                        <option value="new">New Shape</option>
                        <option value="replace">Replace Shape</option>
                    </select>
                    <button id="addSquircle" class="main-button" title="Add Squircle (Shift+click for comp-sized, radius scales with resolution)">
                        Add Squircle
                    </button>
                </div>
                <div class="control-row">
                    <select id="nullType" class="dropdown">
                        <option value="layers">Layers</option>
                        <option value="layers-padding">Layers + Padding</option>
                        <option value="vertex-nulls">Vertex Nulls</option>
                    </select>
                    <button id="addNull" class="main-button">Fit to Squircle</button>
                </div>
                <hr class="subsection-divider">
                <div class="subsection-title">Effects</div>
                <div class="control-row">
                    <select id="elevationType" class="dropdown">
                        <option value="1">Elevation 1</option>
                        <option value="2">Elevation 2</option>
                        <option value="3">Elevation 3</option>
                        <option value="4">Elevation 4</option>
                    </select>
                    <button id="addShadow" class="main-button">Add Shadow</button>
                </div>
                <div class="control-row">
                    <select id="materialType" class="dropdown">
                        <option value="Light Extra Thin">Light Extra Thin</option>
                        <option value="Light Thin">Light Thin</option>
                        <option value="Light Regular">Light Regular</option>
                        <option value="Light Thick">Light Thick</option>
                        <option value="Light Extra Thick">Light Extra Thick</option>
                        <option value="Dark Extra Thin">Dark Extra Thin</option>
                        <option value="Dark Thin">Dark Thin</option>
                        <option value="Dark Regular">Dark Regular</option>
                        <option value="Dark Thick">Dark Thick</option>
                        <option value="Dark Extra Thick">Dark Extra Thick</option>
                    </select>
                    <button id="addBlur" class="main-button">Add Blur</button>
                </div>
                <hr class="subsection-divider">
                <div class="subsection-title">Shimmer</div>
                <div class="control-row">
                    <select id="shimmerType" class="dropdown">
                        <option value="selected">Selected Layers</option>
                        <option value="overlay">Overlay Layer</option>
                    </select>
                    <button id="addShimmer" class="main-button">Add Shimmer</button>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Components Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Components</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="components">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="components">
                <div class="control-row">
                    <select id="componentType" class="dropdown">
                        <option value="dot-loader">Dot Loader</option>
                        <option value="iphone-ui">iPhone UI</option>
                        <option value="timer">Ms Counter</option>
                        <option value="belo-spin">Belo Spin</option>
                    </select>
                    <button id="addComponent" class="main-button">Add Component</button>
                </div>
                </div>
            </section>
        </div>
        
        <!-- Project Setup Section -->
        <div class="section-container">
            <section class="section">
                <div class="section-header">
                    <h2>Project Setup</h2>
                    <div class="section-controls">
                        <button class="section-btn move-up" title="Move Up">
                            <div class="control-arrow up"></div>
                        </button>
                        <button class="section-btn move-down" title="Move Down">
                            <div class="control-arrow down"></div>
                        </button>
                        <button class="accordion-toggle" data-section="project-setup">
                            <div class="accordion-arrow"></div>
                        </button>
                    </div>
                </div>
                <div class="section-content" data-section="project-setup">
                <div class="control-row">
                    <button id="aeFolders" class="main-button">AE Folders</button>
                    <button id="finderFolders" class="main-button">Finder Folders</button>
                </div>
                </div>
            </section>
        </div>
    </div>
    
    <!-- Load Adobe's CEP JavaScript library -->
    <script src="js/CSInterface.js"></script>
    <!-- Load our custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
